<text x="90" y="852" font-size="13">0</text><text x="220" y="852" font-size="13" text-anchor="middle">10</text><text x="350" y="852" font-size="13" text-anchor="middle">20 m</text>
<text x="40" y="938" font-size="13" fill="#666">Ghi chú: dựng theo số đo các cạnh do BTC cung cấp; sơ đồ BTC không theo tỉ lệ nên hình dạng có thể lệch nhẹ. Diện tích tính theo số đo cạnh ≈ 2.208 m². Sơ đồ ý tưởng, không phải bản vẽ kỹ thuật.</text>
