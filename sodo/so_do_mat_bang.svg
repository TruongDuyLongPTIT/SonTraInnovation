<text x="40" y="80" font-size="17" fill="#444">Công viên Đổi mới Sáng tạo Sơn Trà · Khu đất góc Ngô Thì Trí – Vũng Thùng 4 – Lý Nhật Quang · S = 2.000 m² (theo BTC)</text>
