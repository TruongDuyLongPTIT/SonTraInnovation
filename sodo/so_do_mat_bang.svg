<text x="1281" y="561" font-size="14" fill="#222">Cây bóng mát – bố trí phía mặt đường</text>
<text x="1245" y="601" font-size="16" font-weight="bold" fill="#0077b6">HẢI TRÌNH STEM LÀNG CÁ</text>
<circle cx="1258" cy="622" r="11" fill="#0077b6"/>
<text x="1258" y="627" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
<text x="1281" y="627" font-size="14" fill="#222">Vì sao thúng chai nổi?</text>
<circle cx="1258" cy="650" r="11" fill="#0077b6"/>
<text x="1258" y="655" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
